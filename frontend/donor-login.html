<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Login - LifeLink AI</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-page {
            min-height: calc(100vh - 80px);
            display:flex;
            justify-content:center;
            align-items:flex-start;
            padding:80px 20px;
        }
        .auth-wrap { width:100%; max-width:700px; }
        .page-title { text-align:center; margin-bottom:30px; }
        .page-title h2 { font-size:40px; margin-bottom:10px; }
        .page-title p { color:#666; font-size:18px; }
        .auth-card {
            background:#fff;
            border-radius:18px;
            padding:42px;
            box-shadow:0 8px 28px rgba(0,0,0,.09);
        }
        .auth-card h3 { text-align:center; font-size:26px; margin-bottom:8px; }
        .subtitle { text-align:center; color:#666; margin-bottom:28px; }
        .field { margin-bottom:20px; }
        .field label { display:block; font-weight:700; margin-bottom:8px; }
        .field input {
            width:100%;
            box-sizing:border-box;
            padding:15px;
            border:1px solid #ddd;
            border-radius:9px;
            font-size:17px;
        }
        .login-btn { width:100%; margin-top:4px; }
        .message { text-align:center; min-height:24px; margin-top:16px; font-weight:600; }
        .auth-footer { text-align:center; margin-top:24px; color:#666; font-size:17px; }
        .auth-footer a { color:#e9334a; font-weight:700; }
        .demo-note {
            margin-top:20px;
            background:#fff7e8;
            border:1px solid #ffe0a8;
            border-radius:10px;
            padding:12px;
            text-align:center;
            color:#6a552e;
        }
        @media(max-width:650px) {
            .auth-card { padding:28px 18px; }
            .page-title h2 { font-size:32px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">🩸 LifeLink AI</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="donor-signup.html">Create Account</a>
        </div>
    </nav>

    <main class="auth-page">
        <div class="auth-wrap">
            <div class="page-title">
                <h2>🔐 Donor Login</h2>
                <p>Login to access your LifeLink AI donor dashboard.</p>
            </div>

            <div class="auth-card">
                <h3>Welcome Back, Donor</h3>
                <p class="subtitle">Enter your registered phone number and password.</p>

                <div class="field">
                    <label>Phone Number</label>
                    <input id="donor-login-phone" type="tel" placeholder="Enter phone number">
                </div>

                <div class="field">
                    <label>Password</label>
                    <input id="donor-login-password" type="password" placeholder="Enter password">
                </div>

                <button class="login-btn" type="button" onclick="donorLoginPage()">
                    🔐 Login
                </button>

                <div id="donor-login-message" class="message"></div>

                <div class="auth-footer">
                    Don't have a donor account?
                    <a href="donor-signup.html">Create Donor Account</a>
                </div>

                <div class="demo-note">
                    💡 After login, your dashboard will load automatically.
                </div>
            </div>
        </div>
    </main>

    <script src="donor-pages.js"></script>
</body>
</html>
