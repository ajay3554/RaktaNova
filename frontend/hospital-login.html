<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Sign In - RaktaNova</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="hospital-login-page">
    <header class="hospital-login-header">
        <a class="logo" href="index.html"><span class="brand-mark" aria-hidden="true">◊</span> RaktaNova</a>
        <nav class="hospital-login-nav" aria-label="Hospital login navigation">
            <a href="index.html">Home</a>
            <a href="hospital-signup.html">Register hospital</a>
        </nav>
    </header>
    <main class="hospital-login-main">
        <section class="hospital-login-card" aria-labelledby="hospital-login-heading">
            <div class="hospital-login-accent" aria-hidden="true"></div>
            <header class="hospital-login-intro">
                <h1 id="hospital-login-heading">Hospital Sign In</h1>
                <p>Manage requests and donor responses from one focused workspace.</p>
            </header>
            <div class="hospital-welcome">
                <h2>Welcome back</h2>
                <p>Sign in using your hospital ID or registered email.</p>
            </div>
            <div class="hospital-login-fields">
                <div class="hospital-login-field">
                    <label for="hospital-login-identifier">Hospital ID or email</label>
                    <div class="hospital-login-input"><span aria-hidden="true">&#9633;</span><input id="hospital-login-identifier" type="text" autocomplete="username" placeholder="Enter ID or email"></div>
                </div>
                <div class="hospital-login-field">
                    <label for="hospital-login-password">Password</label>
                    <div class="hospital-login-input"><span aria-hidden="true">&#128274;</span><input id="hospital-login-password" type="password" autocomplete="current-password" placeholder="Enter password"></div>
                </div>
            </div>
            <div class="hospital-login-options">
                <label><input type="checkbox"> <span>Remember me</span></label>
                <a href="#">Forgot password?</a>
            </div>
            <button class="hospital-login-submit" type="button" onclick="hospitalLogin()">Sign in to workspace <span aria-hidden="true">&#8594;</span></button>
            <p id="hospital-login-message" class="message" aria-live="polite"></p>
            <p class="auth-footer">Need an account? <a href="hospital-signup.html">Register your hospital.</a></p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
