<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register hospital | LifeLink AI</title><link rel="stylesheet" href="style.css"></head><body><nav class="navbar"><a class="logo" href="index.html"><span class="brand-mark">+</span> LifeLink AI</a><div class="nav-links"><a href="index.html">Home</a><a href="hospital-login.html">Sign in</a></div></nav><main class="auth-page"><div class="auth-wrap"><header class="page-title"><div class="eyebrow">Hospital registration</div><h2>Set up your workspace</h2><p>Create a hospital account to coordinate blood requests with nearby donors.</p></header><section class="auth-card"><h3>Hospital details</h3><div class="field"><label for="hospital-name">Hospital name</label><input id="hospital-name" type="text" placeholder="Enter hospital name"></div><div class="field-row"><div class="field"><label for="hospital-email">Email</label><input id="hospital-email" type="email" autocomplete="email" placeholder="Enter hospital email"></div><div class="field"><label for="hospital-phone">Phone number</label><input id="hospital-phone" type="tel" autocomplete="tel" placeholder="Enter phone number"></div></div><div class="field-row"><div class="field"><label for="hospital-password">Password</label><input id="hospital-password" type="password" autocomplete="new-password" placeholder="Create password"></div><div class="field"><label for="hospital-city">City</label><input id="hospital-city" type="text" placeholder="Enter city"></div></div><div class="field"><label for="hospital-address">Hospital address</label><textarea id="hospital-address" placeholder="Enter hospital address"></textarea></div><div class="field"><label for="available-blood-groups">Available blood groups</label><input id="available-blood-groups" type="text" placeholder="Example: A+, B+, O+"></div><div class="form-actions"><button type="button" onclick="hospitalSignup()">Create hospital account</button></div><p id="hospital-signup-message" class="message" aria-live="polite"></p><p class="auth-footer">Already registered? <a href="hospital-login.html">Sign in</a></p></section></div></main><script src="script.js"></script></body></html>
