<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Become a donor | LifeLink AI</title><link rel="stylesheet" href="style.css"></head><body><nav class="navbar"><a class="logo" href="index.html"><span class="brand-mark">+</span> LifeLink AI</a><div class="nav-links"><a href="index.html">Home</a><a href="hospital-signup.html">Hospital</a></div></nav><main class="auth-page"><div class="auth-wrap"><header class="page-title"><div class="eyebrow">Donor registration</div><h2>Be ready to help</h2><p>Your profile helps hospitals find eligible nearby donors during a request.</p></header><section class="auth-card"><h3>Create your donor account</h3><p class="subtitle">Please provide accurate details for matching.</p><div class="field-row"><div class="field"><label for="donor-name">Full name</label><input id="donor-name" type="text" autocomplete="name" placeholder="Enter your full name"></div><div class="field"><label for="donor-age">Age</label><input id="donor-age" type="number" min="1" max="100" placeholder="Enter your age"></div></div><div class="field-row"><div class="field"><label for="donor-blood-group">Blood group</label><select id="donor-blood-group"><option value="">Select blood group</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div><div class="field"><label for="donor-phone">Phone number</label><input id="donor-phone" type="tel" autocomplete="tel" placeholder="Enter phone number"></div></div><div class="field-row"><div class="field"><label for="donor-password">Password</label><input id="donor-password" type="password" autocomplete="new-password" placeholder="Create password"></div><div class="field"><label for="donor-city">City</label><input id="donor-city" type="text" autocomplete="address-level2" placeholder="Enter city"></div></div><div class="location-box"><p id="donor-location-status">Location is optional, but improves nearby matching.</p><button class="secondary" type="button" onclick="captureDonorLocation()">Use my current location</button></div><div class="form-actions"><button type="button" onclick="registerDonorPage()">Create donor account</button></div><div id="donor-signup-message" class="message" aria-live="polite"></div><p class="auth-footer">Already registered? <a href="donor-login.html">Sign in</a></p></section></div></main><script src="donor-pages.js"></script></body></html>
